name: Scheduled Release

on:
  schedule:
    - cron: '0 0 * * 2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check_new_commits:
    # Enable by setting the repository variable ENABLE_SCHEDULED_RELEASE to "true"
    if: vars.ENABLE_SCHEDULED_RELEASE == 'true'
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.check_commits.outputs.has-changes }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Check for new commits
        id: check_commits
        uses: isaac-cf-wong/detect-git-changes-action@10d1e3ac7c5ee0997d7b370e9929cacac9c87013 # v0.0.19
        with:
          use-latest-tag: true

  create_tag:
    needs: check_new_commits
    if: ${{ needs.check_new_commits.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Bump version
        id: bump_version
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4.9.0
        with:
          config: cliff.toml
          args: --bumped-version

      - name: Create and push tag
        id: tag_version
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          if [ "$PREVIOUS_TAG" = "none" ]; then
            NEW_TAG="v0.1.0"
          else
            NEW_TAG="${{ steps.bump_version.outputs.content }}"
          fi
          if ! git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Creating annotated tag $NEW_TAG"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
            git push origin "$NEW_TAG"
          else
            echo "Tag $NEW_TAG already exists, skipping."
            exit 1
          fi
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

      - name: Output tag information
        run: |
          echo "### Tag Created :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "- **New tag**: ${{ steps.tag_version.outputs.new_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Previous tag**: ${{ steps.tag_version.outputs.previous_tag }}" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: create_tag
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      tag_name: ${{ needs.create_tag.outputs.new_tag }}
